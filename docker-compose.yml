# LOCAL DEVELOPMENT ONLY — production uses MongoDB Atlas + Vercel (no Docker needed).
# Start a local MongoDB:   docker compose up -d
# Then set in .env.local:  MONGODB_URI="mongodb://localhost:27017"
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
